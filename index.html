<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>make.fun — Tanda Tangan Entri</title>
<style>
  body { font-family: system-ui, sans-serif; background:#0b0e14; color:#e6e6e6; margin:0; padding:20px; }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 20px; }
  .card { background:#151a24; border:1px solid #2a3242; border-radius:12px; padding:16px; margin:16px 0; }
  .card h2 { margin:0 0 6px; font-size:17px; }
  .meta { font-size:12px; color:#9aa7bd; word-break:break-all; }
  button { background:#4f7cff; color:#fff; border:0; border-radius:8px; padding:10px 14px; font-size:14px; cursor:pointer; margin:6px 6px 6px 0; }
  button:disabled { background:#3a4356; cursor:not-allowed; }
  button.copy { background:#2a3242; }
  textarea { width:100%; box-sizing:border-box; background:#0b0e14; color:#cfe3ff; border:1px solid #2a3242; border-radius:8px; padding:10px; font-family:ui-monospace, monospace; font-size:12px; }
  .sig { color:#8be89b; }
  .warn { color:#ffb454; font-size:13px; }
  .ok { color:#8be89b; font-size:13px; }
  .step { font-size:13px; color:#9aa7bd; }
</style>
</head>
<body>
<div class="wrap">
  <h1>✍️ Tanda tangan entri make.fun</h1>
  <p class="step">Buka halaman ini di browser yang ada wallet Solana lo (Phantom/Solflare/dll). Wallet yang benar: <b>6ZF5Qh14JdG6jLDDWKsevAj25p6UrapMKLMjbUHTtBZr</b>. Pesan berlaku <b>10 menit</b> sejak dibuat — habis tanda tangan, langsung paste hasilnya ke chat Muse.</p>
  <div id="entries"></div>
</div>
<script>
const WALLET = "6ZF5Qh14JdG6jLDDWKsevAj25p6UrapMKLMjbUHTtBZr";
const ENTRIES = [
  { slug: "github-core-clone-01", label: "1️⃣ GitHub Forge (github-core-clone-01)",
    repo: "https://github.com/BOTTL3WAT3R/makefun-forge",
    commit: "f8697ec7331ed4e6ffff1e0cefacb4452c7a42e5",
    transcripts: "e54d0df334e16e77ad246f55601425d6f0f3815f9df40833f758391a021f5f20" },
  { slug: "token-radar-01", label: "2️⃣ Token Radar (token-radar-01)",
    repo: "https://github.com/BOTTL3WAT3R/makefun-token-radar-01",
    commit: "3ea8c04d42d2be974d4fa52e8c4edea2a4333fd4",
    transcripts: "c4058ee01f01a7efbe0c429d6b5d545e742f55d7b179039a413d790bd25c9d76" },
  { slug: "best-game-01", label: "3️⃣ Game FERROFRENZY R4 (best-game-01)",
    repo: "https://github.com/BOTTL3WAT3R/makefun-ferrofrenzy",
    commit: "7e30b1a57897a7c7d4803170a3bdcebb0af49e99",
    transcripts: "a28b20cb1d43e6aad09e3e553c037d6805dfde3f3e130f654f142a846f62effd" },
  { slug: "gta6-01", label: "4️⃣ GTA 6 — Golden Hour R2 (gta6-01)",
    repo: "https://github.com/BOTTL3WAT3R/makefun-gta6",
    commit: "bfadce28768c66f76633155c4bc831ad5c0ad81c",
    transcripts: "8f51c26eb2d8d2a83e840b0ab6a6ede72803eb4c91d7f0e7a41ea8ba14a54b59" },
  { slug: "news-image-20261117", label: "5️⃣ News Image 17 Nov (news-image-20261117)",
    repo: "https://github.com/BOTTL3WAT3R/makefun-news-image",
    commit: "200b6ed32fb47b1f967eee7a28c7de4d201909a8",
    transcripts: "8cffa073c577ba790fd8810f05c6271088c2408046de159863171b77c85dc823" },
  { slug: "bring-the-humans-02", label: "6️⃣ Guide Tutorial (bring-the-humans-02)",
    repo: "https://github.com/BOTTL3WAT3R/makefun-getting-started",
    commit: "505c95aa3d9ea8c23ac1130a05a3603e9ff33bd6",
    transcripts: "33be36f527765e4eabe2016c5738a6fa94c38844ce7ffe7bbfff560dcd62bffd" },
  { slug: "news-image-20261118", label: "7️⃣ News Image 18 Nov (news-image-20261118)",
    repo: "https://github.com/BOTTL3WAT3R/makefun-news-image-20261118",
    commit: "52721d823350a850997cfd1ec6b62c01de261479",
    transcripts: "f9cb12f41f62a316e3a5bf9d323a189dbd2611c9141a966d7bc1a4fd80f6d84c" }
];
const B58 = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz";
function b58encode(bytes) {
  let zeros = 0; while (zeros < bytes.length && bytes[zeros] === 0) zeros++;
  let digits = [0];
  for (let i = zeros; i < bytes.length; i++) {
    let carry = bytes[i];
    for (let j = 0; j < digits.length; j++) { carry += digits[j] << 8; digits[j] = carry % 58; carry = (carry / 58) | 0; }
    while (carry) { digits.push(carry % 58); carry = (carry / 58) | 0; }
  }
  let out = "1".repeat(zeros);
  for (let i = digits.length - 1; i >= 0; i--) out += B58[digits[i]];
  return out;
}
function getProvider() {
  if (window.phantom && window.phantom.solana) return window.phantom.solana;
  if (window.solana) return window.solana;
  if (window.solflare) return window.solflare;
  return null;
}
const root = document.getElementById("entries");
ENTRIES.forEach((e, idx) => {
  const card = document.createElement("div"); card.className = "card";
  card.innerHTML = "<h2>" + e.label + "</h2>" +
    '<div class="meta">Repo: ' + e.repo + "<br>Commit: " + e.commit + "<br>Transcripts: " + e.transcripts + "</div>" +
    '<p><button id="mk' + idx + '">1) Buat pesan</button>' +
    '<button id="sg' + idx + '" disabled>2) Tanda tangani dengan wallet</button></p>' +
    '<div id="st' + idx + '"></div>' +
    '<p class="step">Pesan entri:</p><textarea id="msg' + idx + '" rows="11" readonly></textarea>' +
    '<p class="step">Tanda tangan (base58):</p><textarea id="sig' + idx + '" class="sig" rows="3" readonly></textarea>' +
    '<p><button class="copy" id="cp' + idx + '">Salin pesan + tanda tangan</button></p>';
  root.appendChild(card);
  let message = "";
  document.getElementById("mk" + idx).onclick = () => {
    const nonceBytes = new Uint8Array(16); crypto.getRandomValues(nonceBytes);
    const nonce = Array.from(nonceBytes).map(b => b.toString(16).padStart(2, "0")).join("");
    const issued = new Date().toISOString().replace(/\.\d+Z$/, "Z");
    message = ["make.fun entry v1", "Domain: make.fun", "Competition: " + e.slug,
      "Repo: " + e.repo, "Commit: " + e.commit, "Transcripts: " + e.transcripts,
      "Wallet: " + WALLET, "Nonce: " + nonce, "Issued At: " + issued].join("\n");
    document.getElementById("msg" + idx).value = message;
    document.getElementById("sg" + idx).disabled = false;
    document.getElementById("st" + idx).innerHTML = '<span class="warn">⏱ Pesan dibuat — tanda tangani dan paste ke chat dalam 10 menit.</span>';
  };
  document.getElementById("sg" + idx).onclick = async () => {
    const st = document.getElementById("st" + idx);
    const provider = getProvider();
    if (!provider) { st.innerHTML = '<span class="warn">Wallet Solana tidak ketemu di browser ini. Buka halaman ini di browser yang ada Phantom/Solflare lo, atau tanda tangani pesan di atas manual di aplikasi wallet lalu paste tanda tangannya ke chat.</span>'; return; }
    try {
      const resp = await provider.connect();
      const pub = (resp && resp.publicKey ? resp.publicKey : provider.publicKey).toString();
      if (pub !== WALLET) { st.innerHTML = '<span class="warn">⚠️ Wallet yang terhubung: ' + pub + ' — BUKAN wallet akun make.fun (' + WALLET + '). Ganti wallet dulu, tanda tangannya bakal ditolak kalau pakai wallet ini.</span>'; return; }
      const encoded = new TextEncoder().encode(message);
      const signed = await provider.signMessage(encoded, "utf8");
      const sigBytes = signed.signature ? signed.signature : signed;
      document.getElementById("sig" + idx).value = b58encode(new Uint8Array(sigBytes));
      st.innerHTML = '<span class="ok">✅ Berhasil ditandatangani. Salin pesan + tanda tangan, paste ke chat Muse sekarang.</span>';
    } catch (err) {
      st.innerHTML = '<span class="warn">Gagal: ' + (err && err.message ? err.message : err) + "</span>";
    }
  };
  document.getElementById("cp" + idx).onclick = async () => {
    const text = document.getElementById("msg" + idx).value + "\n---SIGNATURE---\n" + document.getElementById("sig" + idx).value;
    try { await navigator.clipboard.writeText(text); } catch (e) {}
  };
});
</script>
</body>
</html>
